<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorfly Studio - Generador de Paletas</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <main class="app">

    <!-- Panel izquierdo -->
    <section class="app-info">
      <header class="app-header">
        <h1 class="sr-only">Colorfly Studio</h1>
        <img src="imgs/logo.png" alt="ColorFly Studio logo" width="100%">
        <p>Crea, personaliza y exporta paletas de color en segundos. Genera combinaciones aleatorias, organiza tus colores favoritos y copia sus valores en HEX, RGB o HSL.</p>
      </header>

      <button type="button" id="generatePaletteBtn" class="primary-button">
        Generar paleta <span><img src="imgs/star.svg"></span>
      </button>

      <!-- Toast notification -->
      <div id="toast" class="toast" role="status" aria-live="polite">
        <img src="imgs/Check.svg" alt="" class="toast-icon" />
        <span id="toastMessage">¡Nueva paleta generada!</span>
      </div>


    </section>


    <!-- Panel derecho -->
    <section class="palette-section" aria-labelledby="palette-title">

      <h2 id="palette-title" class="sr-only">
        Paleta de colores
      </h2>

      <div class="palette-content">
        <div id="palette" class="palette" aria-live="polite" >
        </div>

        <button type="button" id="addColorBtn" class="add-color-button" aria-label="Agregar color" title="Agregar color" >
          +
        </button>
      </div>

      <button type="button" id="exportPaletteBtn" class="export-button" title="Exportar paleta">
        Exportar paleta <span><img src="imgs/Save.svg"></span>
      </button>
        
    </section>

  </main>


  <script src="js/script.js"></script>

</body>
</html>
