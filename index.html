<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorfly Studio - Generador de Paletas</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <main class="app">

    <!-- Panel izquierdo -->
    <section class="app-info">
      <header class="app-header">
        <h1>Colorfly Studio</h1>
        <p>Generador de paletas de color</p>
      </header>

      <button type="button" id="generatePaletteBtn" class="primary-button">
        Generar paleta
      </button>

      <!-- Toast notification -->
      <div id="toast" class="toast" role="status" aria-live="polite">
        <img src="imgs/Check.svg" alt="" class="toast-icon" />
        <span>¡Nueva paleta generada!</span>
      </div>


    </section>


    <!-- Panel derecho -->
    <section
      class="palette-section"
      aria-labelledby="palette-title"
    >

      <h2 id="palette-title" class="sr-only">
        Paleta de colores
      </h2>

      <div
        id="palette"
        class="palette"
        aria-live="polite"
      >

        <!-- Color 1 -->
        <article class="color-card">
          <div class="color-preview"></div>

          <div class="color-info">
            <p class="color-hex">#A3D5FF</p>
          </div>
        </article>


        <!-- Color 2 -->
        <article class="color-card">
          <div class="color-preview"></div>

          <div class="color-info">
            <p class="color-hex">#FFD6A5</p>
          </div>
        </article>


        <!-- Color 3 -->
        <article class="color-card">
          <div class="color-preview"></div>

          <div class="color-info">
            <p class="color-hex">#CAFFBF</p>
          </div>
        </article>


        <!-- Color 4 -->
        <article class="color-card">
          <div class="color-preview"></div>

          <div class="color-info">
            <p class="color-hex">#BDB2FF</p>
          </div>
        </article>

      </div>

    </section>

  </main>


  <script src="js/script.js"></script>

</body>
</html>
